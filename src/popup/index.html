<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infron Translate</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <svg class="svg-filters" aria-hidden="true" width="0" height="0">
      <defs>
        <filter
          id="glass-distortion"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.008 0.008"
            numOctaves="2"
            seed="3"
            result="noise"
          />
          <feGaussianBlur in="noise" stdDeviation="0.5" result="softNoise" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="softNoise"
            scale="10"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <div class="shell">
      <div class="liquidGlass-wrapper popup-shell">
        <div class="liquidGlass-effect"></div>
        <div class="liquidGlass-tint"></div>
        <div class="liquidGlass-shine"></div>

        <div class="liquidGlass-text popup-inner">
          <header class="header">
            <div class="brand">
              <img class="logo" src="/icons/infron-mark.png" alt="" aria-hidden="true" />
              <div>
                <h1>Infron Translate</h1>
                <p class="subtitle" id="modeHint">Full-page bilingual</p>
              </div>
            </div>
          </header>

          <section class="menu-item card language-card">
            <div class="row">
              <span class="label">Current site</span>
              <span id="hostname" class="value mono">—</span>
            </div>
            <div class="row">
              <span class="label">Detected language</span>
              <span id="detectedSourceLang" class="value">Detecting...</span>
            </div>
            <label class="switch-row menu-item nested">
              <span class="switch-text">Pause this site</span>
              <input id="pauseToggle" type="checkbox" class="switch" disabled />
            </label>
          </section>

          <section class="menu-item card language-card">
            <label class="select-row">
              <span id="uiLanguageLabel" class="label">Interface language</span>
              <select id="uiLanguageSelect" class="select">
                <option value="zh">中文界面</option>
                <option value="en">English UI</option>
              </select>
            </label>
            <label class="select-row">
              <span id="displayModeLabel" class="label">Display mode</span>
              <select id="displayModeSelect" class="select">
                <option value="bilingual">Bilingual</option>
                <option value="translation-only">Translation only</option>
              </select>
            </label>
          </section>

          <section class="menu-item card">
            <label class="select-row">
              <span class="label">Source language</span>
              <select id="sourceLangSelect" class="select"></select>
            </label>
            <label class="select-row">
              <span class="label">Target language</span>
              <select id="targetLangSelect" class="select"></select>
            </label>
          </section>

          <section class="menu-item card">
            <label class="select-row">
              <span class="label">Translation engine</span>
              <select id="pageEngineSelect" class="select">
                <option value="browser">Chrome built-in translation</option>
                <option value="external">Cloud AI model</option>
              </select>
            </label>
            <button type="button" id="configureCloudModel" class="inline-config" hidden>
              Cloud AI model not configured · Configure
            </button>
            <label class="switch-row menu-item nested">
              <div class="switch-text-block">
                <span class="switch-text">Auto-translate pages</span>
                <span class="switch-desc" id="pageAutoDesc">Off: translate after clicking the button</span>
              </div>
              <input id="pageAutoToggle" type="checkbox" class="switch" />
            </label>
          </section>

          <p class="hint" id="usageHint">
            Translates on demand by default and caches repeated sentences.
          </p>

          <button type="button" id="translatePage" class="btn primary menu-item">
            <span>Translate this page</span>
          </button>

          <section class="menu-item card meeting-card">
            <div>
              <span id="meetingAssistantTitle" class="meeting-title">Meeting Assistant</span>
              <p id="meetingAssistantHint" class="meeting-hint">
                Listen to microphone and meeting audio, then open the live summary screens.
              </p>
            </div>
            <button type="button" id="startMeetingAssistant" class="btn meeting-btn">
              <span>Start Meeting Assistant</span>
            </button>
          </section>

          <button type="button" id="openOptions" class="btn menu-item">
            <span>Open settings</span>
          </button>
          <p id="error" class="error" hidden></p>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
